}
function scheduleFlush() { updateSyncLabel(); if (!syncReady) return; clearTimeout(flushTimer); flushTimer = setTimeout(syncNow, 300); }

let pullCount = 0;
async function pullEvents() {
  const fullPull = (pullCount++ % 10) === 0; // перекрытие окна нужно изредка (на случай «опоздавших» событий), а не при каждом запросе
  let from = fullPull ? Math.max(0, evCursor - 200) : evCursor, added = 0, foreign = 0, touched = false;
  const versionBefore = S.plan.version;
  for (;;) {
    const { data, error } = await sb.from("events").select("seq,id,user_id,type,payload,created_at").gt("seq", from).order("seq", { ascending: true }).limit(500);
    if (error) throw error;
    if (!data.length) break;
    if (data.some(e => e.payload && Number(e.payload.v) > SCHEMA_V)) { needUpdate = true; updateSyncLabel(); showToast("Партнёр пользуется более новой версией. Обновите страницу (Cmd+R / Ctrl+F5).", 9000); }
    from = data[data.length - 1].seq;
    evCursor = Math.max(evCursor, from);
    const batch = evCompactSeq ? data.filter(e => e.seq > evCompactSeq) : data; // уже учтённое в сжатом снимке не добавляем заново
    const known = new Map(evLog.map(e => [e.id, e]));
    batch.forEach(e => {
      const cur = known.get(e.id);
      if (!cur) { added++; if (e.user_id !== currentUser) foreign++; } else if (cur.seq == null) touched = true; // своё событие получило seq
    });
    evLog = SDRCore.mergeLog(evLog, batch);
    if (data.length < 500) break;
  }
  if (added || touched) { persistLog(); rebuild(); }
  if (added) {
    if (planLatestProposal && S.plan.version !== versionBefore) {
      planLatestProposal = null; planLatestDiff = null;
      showToast("План изменился у партнёра: прежнее предложение AI устарело, запросите заново");
    } else if (foreign) showToast("Обновлено партнёром");
    safeRefresh();
  }
}
async function pushEvents() {
  if (needUpdate) return;
  const pending = evLog.filter(e => e.seq == null && !e.bad).sort((a, b) => (a.lc || 0) - (b.lc || 0));
  if (!pending.length) return;
  const row = e => ({ id: e.id, user_id: e.user_id, type: e.type, payload: e.payload });
  const first = await sb.from("events").insert(pending.map(row));
  if (!first.error) return;
  // пачка не прошла: по одному. Дубликаты пропускаем, «ядовитое» событие (сервер отклонил само событие) помечаем и не даём ему блокировать остальные.
  let netErr = null, marked = false;
  for (const e of pending) {
    const r = await sb.from("events").insert(row(e));
    if (!r.error || r.error.code === "23505") continue;
    const st = Number(r.status || 0), code = String(r.error.code || "");
    const rejected = (st >= 400 && st < 500 && ![401, 403, 408, 429].includes(st)) || (/^(22|23|42)/.test(code));
    if (rejected) { e.bad = String(r.error.message || code || st).slice(0, 200); marked = true; } else { netErr = r.error; break; }
  }
  if (marked) { persistLog(); showToast("Сервер отклонил часть изменений: они не будут отправлены партнёру (см. индикатор вверху). Пришлите мне «Диагностику».", 9000); }
  if (netErr) throw netErr;
}
// Проверяет, нужно ли перенести старые данные в журнал (один раз на всю команду).
async function migrateIfNeeded() {
  if (evLog.some(e => e.type === "snapshot")) return;
  const { count, error } = await sb.from("events").select("id", { count: "exact", head: true });
  if (error) throw error;
  if (count > 0) return; // на сервере уже есть события — переносить нечего
  let base = null;
  const r = await sb.from("app_state").select("data").eq("id", "singleton").maybeSingle();
  if (r.error) throw r.error;
  if (r.data && r.data.data && Object.keys(r.data.data).length) base = r.data.data;
  else if (Object.keys(legacyState).length) base = legacyState;
  if (!base) return;
  evLog.push({ id: MIGRATION_ID, seq: null, user_id: "migration", type: "snapshot", payload: { state: base }, lc: 0, created_at: new Date().toISOString() });
  persistLog(); rebuild();
}
async function syncNow() {
  if (!sb) return;
  try { const r = await sb.auth.getSession(); if (!(r.data && r.data.session)) return; } catch {}
  if (syncRunning) { syncAgain = true; return; }
  syncRunning = true;
  try {
    if (!syncReady) { await pullEvents(); await migrateIfNeeded(); syncReady = true; }
    await pushEvents();
    await pullEvents();
    syncErr = "";
    if (!subscribed) { subscribed = true; subscribeEvents(); }
  } catch (e) {
    syncErr = (e && e.message) || String(e);
    console.warn("sync:", syncErr);
  } finally {
    syncRunning = false;
    updateSyncLabel();
    if (syncAgain) { syncAgain = false; setTimeout(syncNow, 200); }
    else if (evLog.some(e => e.seq == null) && syncReady && !syncErr) scheduleFlush();
  }
}
function subscribeEvents() {
  sb.channel("events_feed")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "events" }, () => { syncNow(); })
    .subscribe();
}

/* ============ Установка как приложение (PWA) и автообновление ============
   Работает, когда страница открыта по адресу http(s) (например, GitHub Pages). Из файла (file://) не включается. */
let swReg = null, deferredInstall = null;
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); deferredInstall = ev; });
window.addEventListener("appinstalled", () => { deferredInstall = null; });
function isStandalone() { return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true; }
function showUpdateBanner() {
  if (document.getElementById("update-banner")) return;
  const b = document.createElement("div");
  b.id = "update-banner";
  b.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9998;background:var(--surface,#151821);color:var(--ink,#fff);border:1px solid var(--accent,#6c7bff);border-radius:10px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between";
  const t = document.createElement("span"); t.textContent = "Вышла новая версия приложения. Неотправленные действия не потеряются.";
  const btn = document.createElement("button"); btn.textContent = "Обновить"; btn.className = "plan-btn"; btn.style.marginTop = "0";
  btn.addEventListener("click", () => {
    navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
    if (swReg && swReg.waiting) swReg.waiting.postMessage("skipWaiting"); else location.reload();
  });
  b.appendChild(t); b.appendChild(btn); document.body.appendChild(b);
}
// Автообновление: новая версия включается сама, когда это безопасно (ничего не вводится, всё отправлено); иначе остаётся плашка «Обновить».
function isSafeToReload() {
  const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "checkbox" && a.type !== "button";
  const unsent = evLog.some(e => e.seq == null && !e.bad);
  return !typing && !unsent && !planEditor && !acctForm && !planLatestProposal && !planPendingIcp && !syncRunning;
}
function applyUpdate() {
  try { const n = JSON.parse(sessionStorage.getItem("sdr_auto_reload") || "[]").filter(t => Date.now() - t < 3600000); if (n.length >= 3) return false; n.push(Date.now()); sessionStorage.setItem("sdr_auto_reload", JSON.stringify(n)); sessionStorage.setItem("sdr_just_updated", APP_VERSION); } catch {}
  navigator.serviceWorker.addEventListener("controllerchange", () => location.reload());
  if (swReg && swReg.waiting) swReg.waiting.postMessage("skipWaiting"); else location.reload();
  return true;
}
let autoUpdateTimer = null;
function onUpdateReady() {
  if (autoUpdateTimer) return;
  const attempt = () => {
    if (!(swReg && swReg.waiting)) { clearInterval(autoUpdateTimer); autoUpdateTimer = null; return; }
    if (isSafeToReload()) { clearInterval(autoUpdateTimer); autoUpdateTimer = null; showToast("Обновляю приложение до новой версии…", 3000); setTimeout(() => { if (!applyUpdate()) showUpdateBanner(); }, 600); }
    else showUpdateBanner(); // пока заняты: плашка, повторная попытка через 30 с
  };
  attempt(); if (swReg && swReg.waiting) autoUpdateTimer = setInterval(attempt, 30000);
}
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      swReg = reg;
      try { const v = sessionStorage.getItem("sdr_just_updated"); if (v) { sessionStorage.removeItem("sdr_just_updated"); showToast("Приложение обновлено до версии " + APP_VERSION, 4000); } } catch {}
      if (reg.waiting && navigator.serviceWorker.controller) onUpdateReady();
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing; if (!nw) return;
        nw.addEventListener("statechange", () => { if (nw.state === "installed" && navigator.serviceWorker.controller) onUpdateReady(); });
      });
      const check = () => { reg.update().catch(() => {}); };
      setInterval(check, 600000);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
    }).catch(() => {});
  });
}
function installCardHtml() {
  if (isStandalone()) return `<div class="card"><div class="card-h">Приложение</div><div class="plan-owner-note">Установлено: программа запущена как приложение. Обновления приходят сами.</div></div>`;
  if (!/^https?:$/.test(location.protocol)) return `<div class="card"><div class="card-h">Установка как приложение</div><div class="plan-owner-note">Сейчас программа открыта как файл. Когда её откроют по адресу в браузере, здесь появится кнопка «Установить приложение» (значок в меню «Пуск», Launchpad или меню приложений).</div></div>`;
  return `<div class="card"><div class="card-h">Установка как приложение</div>
    <div class="plan-owner-note">Установленное приложение запускается из меню системы в своём окне и обновляется само.</div>
    ${deferredInstall ? '<button class="plan-btn" id="install-btn">Установить приложение</button>' : '<div class="plan-owner-note">Chrome или Edge: меню браузера (три точки) → «Установить SDR Quest Tracker» (или значок установки в адресной строке). Safari на Mac (macOS 14+): меню «Файл» → «Добавить в Dock».</div>'}</div>`;
}

/* ============ Экран «Введите ключ команды» ============ */
function showKeyGate(msg) {
  document.getElementById("app-wrap").style.display = "none";
  document.getElementById("picker-wrap").style.display = "none";
  document.getElementById("key-wrap").style.display = "";
  document.getElementById("key-error").textContent = msg || "";
  const hasLocal = evLog.length > 0 || Object.keys(legacyState).length > 0;
  document.getElementById("key-offline").style.display = hasLocal ? "" : "none";
  setTimeout(() => document.getElementById("key-input").focus(), 50);
}
document.getElementById("key-form").addEventListener("submit", async ev => {
  ev.preventDefault();
  const key = document.getElementById("key-input").value;
  const btn = document.getElementById("key-btn");
  if (!key) { document.getElementById("key-error").textContent = "Введите ключ"; return; }
  btn.disabled = true; document.getElementById("key-error").textContent = "Проверяю…";
  const { error } = await sb.auth.signInWithPassword({ email: TEAM_EMAIL, password: key });
  btn.disabled = false;
  if (error) {
    document.getElementById("key-error").textContent = /invalid|credentials/i.test(error.message) ? "Ключ не подошёл. Проверьте раскладку и регистр." : "Не удалось войти: " + error.message;
    return;
  }
  document.getElementById("key-input").value = "";
  enterApp();
});
document.getElementById("key-offline").addEventListener("click", () => { document.getElementById("key-wrap").style.display = "none"; enterApp(true); });

function enterApp(offlineOnly) {
  document.getElementById("key-wrap").style.display = "none";
  if (currentUser) showApp(); else showPicker();
  updateSyncLabel();
  if (offlineOnly || !sb) return;
  updateSyncLabel();
  syncNow();
  setTimeout(() => { try { lhPull(); lhLivePull(); } catch {} }, 4000);
  if (!window.__syncTimers) {
    window.__syncTimers = true;
    setInterval(() => { if (!document.hidden) syncNow(); }, 30000);
    window.addEventListener("online", syncNow);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) syncNow(); });
  }
}
window.addEventListener("storage", ev => {
  // другая вкладка этого же браузера записала журнал: подмешиваем её события, чтобы ничего не потерять
  if (ev.key !== EVENTS_KEY || !ev.newValue) return;
  try {
    const o = JSON.parse(ev.newValue);
    if (!o || !Array.isArray(o.events)) return;
    const before = evLog.length;
    evLog = SDRCore.mergeLog(evLog, o.events);
    evCursor = Math.max(evCursor, o.cursor || 0);
    evLc = evLog.reduce((m, e) => Math.max(m, e.lc || 0), evLc);
    if (evLog.length !== before) { rebuild(); safeRefresh(); scheduleFlush(); }
  } catch {}
});
window.__signOut = async () => {
  try { await sb.removeAllChannels(); } catch {} await sb.auth.signOut(); syncReady = false; subscribed = false; showKeyGate(); };

(async function start() {
  if (!sb) { enterApp(); return; }
  let session = null;
  try { const r = await sb.auth.getSession(); session = r.data && r.data.session; } catch {}
  if (session) enterApp(); else showKeyGate();
  sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") showKeyGate(); });
})();

})();
</script>
